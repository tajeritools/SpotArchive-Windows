name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name SpotArchive spotarchive.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpotArchive-Windows-EXE
          path: dist/SpotArchive.exe
